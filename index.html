<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lane Runner</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏃</text></svg>">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <div id="app">
    <main id="stage">
      <canvas id="game"></canvas>
      <div id="hud" aria-live="off">
        <div class="score-row"><span class="mult">x1</span><span id="score">000000</span></div>
        <div class="coin-row"><span id="coins">0</span><span class="coin-icon" aria-hidden="true"></span></div>
      </div>
      <div id="flash" aria-hidden="true"></div>
      <button id="gear" type="button" aria-label="Tuning" aria-expanded="false">⚙️</button>
      <div id="start" class="overlay">
        <h1>Lane Runner</h1>
        <p class="cta">Tap / press Space to run</p>
        <p class="hint">Swipe or use arrow keys to move</p>
      </div>
      <div id="crash" class="overlay" hidden>
        <div class="card">
          <div class="spiral" aria-hidden="true"></div>
          <h2>Score</h2>
          <div class="final-score">0</div>
          <div class="final-row"><span class="coin-icon" aria-hidden="true"></span><span class="final-coins">0</span></div>
          <p class="new-best" hidden>New best!</p>
          <p class="best-row">Best <span class="best">0</span></p>
          <ol class="top-runs" aria-label="Top runs"></ol>
          <button type="button" class="play">PLAY</button>
        </div>
      </div>
      <div id="notice" role="status" hidden></div>
    </main>
    <aside id="panel" aria-label="Tuning" hidden></aside>
  </div>
</body>
</html>
